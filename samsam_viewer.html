<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쌤쌤 뷰어 — 같은 동작, 다른 스타일</title>
<style>
  body { margin: 0; background: #0b0e14; color: #d4deee; font-family: -apple-system, sans-serif; }
  h1 { text-align: center; font-size: 1.15rem; font-weight: 600; padding: 16px 0 4px; margin: 0; }
  p.sub { text-align: center; color: #6a7a99; font-size: 0.85rem; margin: 0 0 12px; }
  .row { display: flex; gap: 10px; padding: 0 12px 12px; flex-wrap: wrap; justify-content: center; }
  .panel { flex: 1 1 320px; max-width: 460px; min-width: 0; }
  .panel h2 { font-size: 0.85rem; text-align: center; margin: 0 0 5px; color: #b8c6e0; font-weight: 600; }
  .panel .tag { display: block; font-size: 0.72rem; color: #6a7a99; font-weight: 400; margin-top: 1px; }
  .panel canvas { display: block; width: 100%; aspect-ratio: 3 / 4; border-radius: 8px; background: #0d111a; }
</style>
</head>
<body>
<h1>쌤쌤 — 같은 콘텐츠 동작, 사람마다 다른 스타일</h1>
<p class="sub">Motion Puzzle 스타일 전이 출력을 Mixamo 캐릭터에 리타겟(2026-07-26) · 드래그로 카메라 회전</p>
<div class="row" id="panels">
  <div class="panel"><h2>원본 콘텐츠<span class="tag">스타일 전이 전 (127_21)</span></h2></div>
  <div class="panel"><h2>스타일 A<span class="tag">142_21 스타일 주입</span></h2></div>
  <div class="panel"><h2>스타일 B<span class="tag">41_02 스타일 주입</span></h2></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { BVHLoader } from 'three/addons/loaders/BVHLoader.js';
import { clone as cloneSkinned } from 'three/addons/utils/SkeletonUtils.js';

// 3패널 = 같은 콘텐츠 동작에 서로 다른 스타일을 입힌 Motion Puzzle 출력(모두 CMU-BVH 포맷).
// 셋 다 같은 X Bot 캐릭터에 리타겟해 "같은 동작, 다른 스타일"을 캐릭터로 비교.
const SOURCES = [
  { file: 'viewer_data/content_original.bvh' },
  { file: 'viewer_data/style_a.bvh' },
  { file: 'viewer_data/style_b.bvh' },
];

// 소스 CMU(BVH) 관절 이름 -> 타겟 mixamorig 본 이름. (근거는 커밋 이력·samsam_dev_spec.md 4-1)
const CMU_TO_MIXAMO = {
  Hips: 'mixamorigHips',
  Spine: 'mixamorigSpine1', Spine1: 'mixamorigSpine2',
  Neck1: 'mixamorigNeck', Head: 'mixamorigHead',
  LeftArm: 'mixamorigLeftArm', LeftForeArm: 'mixamorigLeftForeArm', LeftHand: 'mixamorigLeftHand',
  RightArm: 'mixamorigRightArm', RightForeArm: 'mixamorigRightForeArm', RightHand: 'mixamorigRightHand',
  LeftUpLeg: 'mixamorigLeftUpLeg', LeftLeg: 'mixamorigLeftLeg',
  LeftFoot: 'mixamorigLeftFoot', LeftToeBase: 'mixamorigLeftToeBase',
  RightUpLeg: 'mixamorigRightUpLeg', RightLeg: 'mixamorigRightLeg',
  RightFoot: 'mixamorigRightFoot', RightToeBase: 'mixamorigRightToeBase',
};

// CMU 로컬 회전 Q_src(t) -> 타겟 로컬 회전.  ℓ_i(t) = A_parent(i)⁻¹ · Q_src_i(t) · A_i
//   A_i = 타겟 본 i의 rest 월드 누적 회전.  (부모 누적회전 A_parent를 빠뜨리면 팔·다리가 어긋난다)
// hipCfg = {restLocal, scale} 를 주면 힙 이동(점프·전진) 트랙도 만든다 — X Bot·CMU 둘 다 Y-up이라
// 축 스왑 없이 성분 그대로:  hipLocal(t) = restLocal + (bvhHip(t) - bvhHip(0)) · scale.
function buildRetargetClip(bvhClip, kmByBone, hipCfg) {
  const tracks = [];
  const qs = new THREE.Quaternion();
  for (const track of bvhClip.tracks) {
    const m = track.name.match(/^(.+)\.quaternion$/);
    if (!m) continue;
    const mixamoBone = CMU_TO_MIXAMO[m[1]];
    if (!mixamoBone || !kmByBone[mixamoBone]) continue;
    const { K, M } = kmByBone[mixamoBone];
    const values = track.values.slice();
    for (let i = 0; i < values.length; i += 4) {
      qs.set(values[i], values[i + 1], values[i + 2], values[i + 3]);
      const out = K.clone().multiply(qs).multiply(M);
      values[i] = out.x; values[i + 1] = out.y; values[i + 2] = out.z; values[i + 3] = out.w;
    }
    tracks.push(new THREE.QuaternionKeyframeTrack(`${mixamoBone}.quaternion`, track.times, values));
  }
  if (hipCfg) {
    const hipTrack = bvhClip.tracks.find((t) => t.name === 'Hips.position');
    if (hipTrack) {
      const src = hipTrack.values;
      const x0 = src[0], y0 = src[1], z0 = src[2];
      const s = hipCfg.scale, r = hipCfg.restLocal;
      const positions = new Float32Array(src.length);
      for (let i = 0; i < src.length; i += 3) {
        positions[i] = r.x + (src[i] - x0) * s;
        positions[i + 1] = r.y + (src[i + 1] - y0) * s;
        positions[i + 2] = r.z + (src[i + 2] - z0) * s;
      }
      tracks.push(new THREE.VectorKeyframeTrack('mixamorigHips.position', hipTrack.times, positions));
    }
  }
  return new THREE.AnimationClip('retargeted', bvhClip.duration, tracks);
}

// rest 포즈만으로 리타겟 rig(kmByBone + hipCfg)를 계산. 3개 소스가 같은 CMU 골격이라 한 번만
// 계산해 모든 캐릭터에 재사용한다(타겟 rest·소스 rest 모두 파일마다 동일).
function computeRig(targetSkinned, srcSkeleton) {
  const bones = {};
  targetSkinned.skeleton.bones.forEach((b) => { bones[b.name] = b; });
  targetSkinned.skeleton.bones[0].updateWorldMatrix(true, true);
  const srcBones = {};
  srcSkeleton.bones.forEach((b) => { srcBones[b.name] = b; });
  srcSkeleton.bones[0].updateWorldMatrix(true, true);
  const MIXAMO_TO_CMU = {};
  for (const [c, m] of Object.entries(CMU_TO_MIXAMO)) MIXAMO_TO_CMU[m] = c;

  // T-pose 방향 정렬: 각 사지 본의 rest 월드 방향(부모→자식)을 소스에 맞추는 최소회전.
  // (X Bot rest 다리가 CMU보다 ~20° 벌어져 무릎이 안쪽으로 꼬이던 걸 없앤다)
  const DIR_CHILD = {
    mixamorigLeftUpLeg: 'mixamorigLeftLeg', mixamorigLeftLeg: 'mixamorigLeftFoot', mixamorigLeftFoot: 'mixamorigLeftToeBase',
    mixamorigRightUpLeg: 'mixamorigRightLeg', mixamorigRightLeg: 'mixamorigRightFoot', mixamorigRightFoot: 'mixamorigRightToeBase',
    mixamorigLeftArm: 'mixamorigLeftForeArm', mixamorigLeftForeArm: 'mixamorigLeftHand',
    mixamorigRightArm: 'mixamorigRightForeArm', mixamorigRightForeArm: 'mixamorigRightHand',
  };
  const worldDir = (a, b) => b.getWorldPosition(new THREE.Vector3()).sub(a.getWorldPosition(new THREE.Vector3())).normalize();
  const alignByBone = {};
  for (const [mName, mChild] of Object.entries(DIR_CHILD)) {
    const tBone = bones[mName], tChild = bones[mChild];
    const sName = MIXAMO_TO_CMU[mName], sChild = MIXAMO_TO_CMU[mChild];
    if (!tBone || !tChild || !srcBones[sName] || !srcBones[sChild]) continue;
    alignByBone[mName] = new THREE.Quaternion().setFromUnitVectors(worldDir(tBone, tChild), worldDir(srcBones[sName], srcBones[sChild]));
  }
  const Mworld = {};
  targetSkinned.skeleton.bones.forEach((b) => {
    const A = b.getWorldQuaternion(new THREE.Quaternion());
    const al = alignByBone[b.name];
    Mworld[b.name] = al ? al.clone().multiply(A) : A;
  });
  const kmByBone = {};
  for (const mName of Object.values(CMU_TO_MIXAMO)) {
    const bone = bones[mName];
    if (!bone) continue;
    const parentM = (bone.parent && Mworld[bone.parent.name]) ? Mworld[bone.parent.name] : new THREE.Quaternion();
    kmByBone[mName] = { K: parentM.clone().invert(), M: Mworld[mName].clone() };
  }

  // 힙 이동 스케일 = X Bot 다리길이(cm) / CMU 다리길이(BVH단위). worldScale(0.01)로 cm 복원.
  const legLen = (map, up, lo, ft) =>
    map[up].getWorldPosition(new THREE.Vector3()).distanceTo(map[lo].getWorldPosition(new THREE.Vector3())) +
    map[lo].getWorldPosition(new THREE.Vector3()).distanceTo(map[ft].getWorldPosition(new THREE.Vector3()));
  const ws = new THREE.Vector3();
  bones['mixamorigHips'].getWorldScale(ws);
  const xbotLegCm = legLen(bones, 'mixamorigRightUpLeg', 'mixamorigRightLeg', 'mixamorigRightFoot') / (ws.x || 1);
  const bvhLeg = legLen(srcBones, 'RightUpLeg', 'RightLeg', 'RightFoot');
  const hipCfg = { restLocal: bones['mixamorigHips'].position.clone(), scale: xbotLegCm / bvhLeg };
  return { kmByBone, hipCfg };
}

const masterClock = new THREE.Clock();
const allMixers = [];
const allRenderFns = [];

function setupCharacterPanel(panelEl, xbotTemplate, rig, bvhResult) {
  const character = cloneSkinned(xbotTemplate); // 자체 스켈레톤을 가진 깊은 복제
  character.scale.setScalar(0.01); // cm → m
  const skinned = character.getObjectByProperty('type', 'SkinnedMesh');

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0d111a);
  scene.add(new THREE.HemisphereLight(0xdfe7f5, 0x2a2f3a, 2.4));
  const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(1.5, 3, 2.5); scene.add(key);
  const fill = new THREE.DirectionalLight(0x9db4d8, 1.0); fill.position.set(-2, 1, 1.5); scene.add(fill);
  const grid = new THREE.GridHelper(4, 12, 0x2c3a56, 0x18202e);
  scene.add(grid);
  scene.add(character);

  const camera = new THREE.PerspectiveCamera(42, 3 / 4, 0.01, 100);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(360, 480, false);
  panelEl.appendChild(renderer.domElement);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enablePan = false;

  character.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(character);
  const center = box.getCenter(new THREE.Vector3());
  const height = Math.max(box.max.y - box.min.y, 0.1);
  grid.position.set(center.x, box.min.y, center.z);
  camera.position.set(center.x, center.y + height * 0.12, center.z + height * 2.3);
  camera.near = height / 100; camera.far = height * 200;
  camera.updateProjectionMatrix();
  controls.target.set(center.x, center.y, center.z);
  controls.update();

  const clip = buildRetargetClip(bvhResult.clip, rig.kmByBone, rig.hipCfg);
  const mixer = new THREE.AnimationMixer(character);
  mixer.clipAction(clip).play();
  mixer.update(masterClock.getElapsedTime()); // 패널 간 시각 동기화
  allMixers.push(mixer);

  // 캐릭터가 전진(~6.8m)하므로 카메라가 힙 수평 이동을 따라간다(점프는 프레임 안에서 보임).
  const hipBone = skinned.skeleton.bones.find((b) => b.name === 'mixamorigHips');
  const cur = new THREE.Vector3(), prev = new THREE.Vector3();
  let inited = false;
  allRenderFns.push(() => {
    if (hipBone) {
      hipBone.getWorldPosition(cur);
      if (!inited) { prev.copy(cur); inited = true; }
      const dx = cur.x - prev.x, dz = cur.z - prev.z;
      camera.position.x += dx; camera.position.z += dz;
      controls.target.x += dx; controls.target.z += dz;
      prev.copy(cur);
    }
    controls.update();
    renderer.render(scene, camera);
  });
}

Promise.all([
  new Promise((res) => new FBXLoader().load('viewer_data/xbot.fbx', res)),
  ...SOURCES.map((s) => new Promise((res) => new BVHLoader().load(s.file, res))),
]).then(([xbot, ...bvhResults]) => {
  xbot.updateMatrixWorld(true);
  const templateSkinned = xbot.getObjectByProperty('type', 'SkinnedMesh');
  // rig는 rest만 쓰므로 한 번 계산해 3패널 공유(모두 같은 CMU 골격·같은 X Bot rest).
  const rig = computeRig(templateSkinned, bvhResults[0].skeleton);

  const panels = document.querySelectorAll('#panels .panel');
  SOURCES.forEach((s, i) => setupCharacterPanel(panels[i], xbot, rig, bvhResults[i]));
});

function animate() {
  requestAnimationFrame(animate);
  const delta = masterClock.getDelta();
  allMixers.forEach((m) => m.update(delta));
  allRenderFns.forEach((r) => r());
}
animate();
</script>
</body>
</html>
