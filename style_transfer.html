<!DOCTYPE html>
<html lang="ko">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쌤쌤 — 스타일 전이 UI</title>
<style>
  body { margin: 0; background: #0b0e14; color: #d4deee; font-family: -apple-system, sans-serif; }
  h1 { text-align: center; font-size: 1.15rem; font-weight: 600; padding: 14px 0 2px; margin: 0; }
  p.sub { text-align: center; color: #6a7a99; font-size: 0.82rem; margin: 0 0 12px; }
  .bar { display: flex; gap: 14px; align-items: flex-end; justify-content: center; flex-wrap: wrap; padding: 0 12px 12px; }
  .ctl { display: flex; flex-direction: column; gap: 4px; }
  .ctl label { font-size: 0.72rem; color: #8ea0c0; }
  select { background: #121826; color: #e8ecf5; border: 1px solid #263050; border-radius: 7px; padding: 7px 10px; font-size: 0.85rem; min-width: 150px; }
  button { background: #3dd7b8; color: #04231c; border: none; border-radius: 7px; padding: 9px 18px; font-size: 0.88rem; font-weight: 700; cursor: pointer; }
  button:disabled { background: #2a3550; color: #6a7a99; cursor: default; }
  .upbtn { display: inline-block; background: #182236; border: 1px solid #2c3a56; color: #b8c6e0; border-radius: 7px; padding: 8px 12px; font-size: 0.82rem; cursor: pointer; }
  .upbtn:hover { border-color: #3dd7b8; color: #e8ecf5; }
  .status { font-size: 0.78rem; color: #9aa9c4; min-height: 1.1em; align-self: center; }
  .status.err { color: #ff8a8a; }
  .note { text-align: center; font-size: 0.72rem; color: #55617a; margin: -6px 0 10px; }
  .row { display: flex; gap: 10px; padding: 0 12px 16px; flex-wrap: wrap; justify-content: center; }
  .panel { flex: 1 1 300px; max-width: 440px; min-width: 0; }
  .panel h2 { font-size: 0.85rem; text-align: center; margin: 0 0 5px; color: #b8c6e0; font-weight: 600; }
  .panel .tag { display: block; font-size: 0.72rem; color: #6a7a99; font-weight: 400; }

<body>
<h1>쌤쌤 — 스타일 전이 UI</h1>
<p class="sub">콘텐츠 모션 + 레퍼런스 스타일 모션 → Motion Puzzle 스타일 전이 → Mixamo 캐릭터로 확인</p>
<div class="bar">
  <div class="ctl"><label for="content">콘텐츠 모션 (무엇을 하는가)</label><select id="content"></select></div>
  <div class="ctl"><label for="style">레퍼런스 스타일 (어떤 결로)</label><select id="style"></select></div>
  <button id="run">스타일 전이 실행</button>
  <div class="ctl"><label>커스텀 BVH</label><label class="upbtn" for="upload">＋ 업로드<input id="upload" type="file" accept=".bvh" hidden></label></div>
  <div class="ctl"><label>캐릭터 모델</label><label class="upbtn" for="modelUpload">🧍 교체 (.fbx)<input id="modelUpload" type="file" accept=".fbx" hidden></label></div>
  <div class="ctl"><label>화면 저장</label><div style="display:flex; gap:6px;">
    <button class="upbtn" id="saveImgBtn" type="button">📷 이미지</button>
    <button class="upbtn" id="saveVidBtn" type="button">🔴 영상 시작</button>
  </div></div>
  <div class="status" id="status"></div>
</div>
<p class="note">영상 → 모션(BVH) 변환은 GVHMR(Colab GPU) 단계입니다. 여기선 그 결과·레퍼런스 BVH(CMU 형식, `retarget_smpl_to_cmu.py` 출력)를 입력으로 씁니다.</p>
<div class="row" id="panels">
  <div class="panel"><h2>콘텐츠<span class="tag" id="content-tag">—</span></h2></div>
  <div class="panel"><h2>레퍼런스 스타일<span class="tag" id="style-tag">—</span></h2></div>
  <div class="panel result"><h2>스타일 전이 결과<span class="tag" id="result-tag">실행 전</span></h2></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { BVHLoader } from 'three/addons/loaders/BVHLoader.js';
import { clone as cloneSkinned } from 'three/addons/utils/SkeletonUtils.js';

// --- 리타겟 (samsam_viewer.html과 동일 로직; 근거는 samsam_dev_spec.md 4-1) ---
const CMU_TO_MIXAMO = {
  Hips: 'mixamorigHips',
  Spine: 'mixamorigSpine1', Spine1: 'mixamorigSpine2',
  Neck1: 'mixamorigNeck', Head: 'mixamorigHead',
  LeftArm: 'mixamorigLeftArm', LeftForeArm: 'mixamorigLeftForeArm', LeftHand: 'mixamorigLeftHand',
  RightArm: 'mixamorigRightArm', RightForeArm: 'mixamorigRightForeArm', RightHand: 'mixamorigRightHand',
  LeftUpLeg: 'mixamorigLeftUpLeg', LeftLeg: 'mixamorigLeftLeg',
  LeftFoot: 'mixamorigLeftFoot', LeftToeBase: 'mixamorigLeftToeBase',
  RightUpLeg: 'mixamorigRightUpLeg', RightLeg: 'mixamorigRightLeg',
  RightFoot: 'mixamorigRightFoot', RightToeBase: 'mixamorigRightToeBase',
};
function buildRetargetClip(bvhClip, kmByBone, hipCfg) {
  const tracks = [];
  const qs = new THREE.Quaternion();
  for (const track of bvhClip.tracks) {
    const m = track.name.match(/^(.+)\.quaternion$/);
    if (!m) continue;
    const mixamoBone = CMU_TO_MIXAMO[m[1]];
    if (!mixamoBone || !kmByBone[mixamoBone]) continue;
    const { K, M } = kmByBone[mixamoBone];
    const values = track.values.slice();
    for (let i = 0; i < values.length; i += 4) {
      qs.set(values[i], values[i + 1], values[i + 2], values[i + 3]);
      const out = K.clone().multiply(qs).multiply(M);
      values[i] = out.x; values[i + 1] = out.y; values[i + 2] = out.z; values[i + 3] = out.w;
    }
    tracks.push(new THREE.QuaternionKeyframeTrack(`${mixamoBone}.quaternion`, track.times, values));
  }
  if (hipCfg) {
    const hipTrack = bvhClip.tracks.find((t) => t.name === 'Hips.position');
    if (hipTrack) {
      // 비교 UI에선 verticalOnly=true — 수평 전진(~6.8m)은 빼고 점프(Y)만 남긴다. 캐릭터가
      // 제자리에서 뛰어 항상 프레임에 잡히고, 스타일 비교가 깔끔하다(카메라 추적 불필요).
      const src = hipTrack.values;
      const y0 = src[1], s = hipCfg.scale, r = hipCfg.restLocal, vOnly = hipCfg.verticalOnly;
      const x0 = src[0], z0 = src[2];
      const positions = new Float32Array(src.length);
      for (let i = 0; i < src.length; i += 3) {
        positions[i] = vOnly ? r.x : r.x + (src[i] - x0) * s;
        positions[i + 1] = r.y + (src[i + 1] - y0) * s;
        positions[i + 2] = vOnly ? r.z : r.z + (src[i + 2] - z0) * s;
      }
      tracks.push(new THREE.VectorKeyframeTrack('mixamorigHips.position', hipTrack.times, positions));
    }
  }
  return new THREE.AnimationClip('retargeted', bvhClip.duration, tracks);
}
function computeRig(targetSkinned, srcSkeleton) {
  const bones = {};
  targetSkinned.skeleton.bones.forEach((b) => { bones[b.name] = b; });
  if (!bones['mixamorigHips']) {
    const found = Object.keys(bones).slice(0, 5).join(', ') || '(본 없음)';
    throw new Error(`mixamorigHips 본이 없어 리타겟할 수 없어요. Mixamo에서 "FBX Binary + With Skin"으로 내려받은 파일인지 확인해 주세요. 이 파일의 본: ${found}…`);
  }
  targetSkinned.skeleton.bones[0].updateWorldMatrix(true, true);
  const srcBones = {};
  srcSkeleton.bones.forEach((b) => { srcBones[b.name] = b; });
  srcSkeleton.bones[0].updateWorldMatrix(true, true);
  const MIXAMO_TO_CMU = {};
  for (const [c, m] of Object.entries(CMU_TO_MIXAMO)) MIXAMO_TO_CMU[m] = c;
  const DIR_CHILD = {
    mixamorigLeftUpLeg: 'mixamorigLeftLeg', mixamorigLeftLeg: 'mixamorigLeftFoot', mixamorigLeftFoot: 'mixamorigLeftToeBase',
    mixamorigRightUpLeg: 'mixamorigRightLeg', mixamorigRightLeg: 'mixamorigRightFoot', mixamorigRightFoot: 'mixamorigRightToeBase',
    mixamorigLeftArm: 'mixamorigLeftForeArm', mixamorigLeftForeArm: 'mixamorigLeftHand',
    mixamorigRightArm: 'mixamorigRightForeArm', mixamorigRightForeArm: 'mixamorigRightHand',
  };
  const worldDir = (a, b) => b.getWorldPosition(new THREE.Vector3()).sub(a.getWorldPosition(new THREE.Vector3())).normalize();
  const alignByBone = {};
  for (const [mName, mChild] of Object.entries(DIR_CHILD)) {
    const tBone = bones[mName], tChild = bones[mChild];
    const sName = MIXAMO_TO_CMU[mName], sChild = MIXAMO_TO_CMU[mChild];
    if (!tBone || !tChild || !srcBones[sName] || !srcBones[sChild]) continue;
    alignByBone[mName] = new THREE.Quaternion().setFromUnitVectors(worldDir(tBone, tChild), worldDir(srcBones[sName], srcBones[sChild]));
  }
  const Mworld = {};
  targetSkinned.skeleton.bones.forEach((b) => {
    const A = b.getWorldQuaternion(new THREE.Quaternion());
    const al = alignByBone[b.name];
    Mworld[b.name] = al ? al.clone().multiply(A) : A;
  });
  const kmByBone = {};
  for (const mName of Object.values(CMU_TO_MIXAMO)) {
    const bone = bones[mName];
    if (!bone) continue;
    const parentM = (bone.parent && Mworld[bone.parent.name]) ? Mworld[bone.parent.name] : new THREE.Quaternion();
    kmByBone[mName] = { K: parentM.clone().invert(), M: Mworld[mName].clone() };
  }
  const legLen = (map, up, lo, ft) =>
    map[up].getWorldPosition(new THREE.Vector3()).distanceTo(map[lo].getWorldPosition(new THREE.Vector3())) +
    map[lo].getWorldPosition(new THREE.Vector3()).distanceTo(map[ft].getWorldPosition(new THREE.Vector3()));
  const ws = new THREE.Vector3();
  bones['mixamorigHips'].getWorldScale(ws);
  const xbotLegCm = legLen(bones, 'mixamorigRightUpLeg', 'mixamorigRightLeg', 'mixamorigRightFoot') / (ws.x || 1);
  const bvhLeg = legLen(srcBones, 'RightUpLeg', 'RightLeg', 'RightFoot');
  return { kmByBone, hipCfg: { restLocal: bones['mixamorigHips'].position.clone(), scale: xbotLegCm / bvhLeg, verticalOnly: true } };
}

const masterClock = new THREE.Clock();
const bvhLoader = new BVHLoader();

// Mixamo 캐릭터는 SkinnedMesh가 여러 개(몸·머리카락·신발…)이고, 각 메시의 skeleton.bones에는
// 그 메시를 스킨하는 본만 들어간다. 첫 메시가 신발이면 그 skeleton엔 Hips가 아예 없다
// (실제 사례: 본 목록이 LeftLeg부터 시작). ponytail: 본이 가장 많은 메시 = 전체 골격.
function pickSkinned(root) {
  let best = null;
  root.traverse((o) => {
    if (o.isSkinnedMesh && (!best || o.skeleton.bones.length > best.skeleton.bones.length)) best = o;
  });
  return best;
}

// Mixamo는 이미 리깅된 FBX를 다시 올리면 본 접두사에 번호를 붙인다(mixamorig1:Hips…). three의
// PropertyBinding.sanitizeNodeName이 ':'를 지워 'mixamorig1Hips'가 되고 이름 매칭이 전부 빗나간다.
// ponytail: 이름만 표준형으로 되돌리면 리타겟 로직은 한 줄도 안 건드린다.
function normalizeMixamoBoneNames(root) {
  root.traverse((o) => { o.name = o.name.replace(/^mixamorig[\d_]*:?/i, 'mixamorig'); });
}

// 업로드된 FBX는 path=''로 파싱해 외부 텍스처(.fbm 등)를 못 불러온다 — 못 불러온 맵이 검게 렌더돼
// 캐릭터가 안 보인다. 하지만 FBX Binary는 이미지를 파일 안에 담고(FBXLoader가 blob: URL로 넘긴다),
// 예전 코드는 그 살아 있는 맵까지 전부 버려서 Mixamo 캐릭터가 회색으로 나왔다.
// ponytail: 외부 URL만 1x1 흰 픽셀로 갈아끼운다 — 로드 실패가 없으니 사후 정리도 필요 없다.
// (텍스처 로드는 비동기여서 파싱 직후에 성공/실패를 판정하는 방법은 애초에 없다.)
const WHITE_PX = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAIAAACQd1PeAAAADElEQVR4nGP4//8/AAX+Av4N70a4AAAAAElFTkSuQmCC';
const embeddedOnly = new THREE.LoadingManager();
embeddedOnly.setURLModifier((url) => (/^(blob:|data:)/.test(url) ? url : WHITE_PX));

// 패널 하나 = 씬+캐릭터+카메라. setMotion(bvhUrl)로 언제든 다른 모션을 로드해 갈아끼운다.
function makePanel(panelEl, xbotTemplate, rig) {
  const character = cloneSkinned(xbotTemplate);
  character.scale.setScalar(0.01);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0d111a);
  scene.add(new THREE.HemisphereLight(0xdfe7f5, 0x2a2f3a, 2.4));
  const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(1.5, 3, 2.5); scene.add(key);
  const fill = new THREE.DirectionalLight(0x9db4d8, 1.0); fill.position.set(-2, 1, 1.5); scene.add(fill);
  const grid = new THREE.GridHelper(4, 12, 0x2c3a56, 0x18202e); scene.add(grid);
  scene.add(character);

  const camera = new THREE.PerspectiveCamera(42, 3 / 4, 0.01, 100);
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); // 화면 저장 시 canvas를 읽어야 해서 필요
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(340, 453, false);
  panelEl.querySelector('h2').after(renderer.domElement);
  const controls = new OrbitControls(camera, renderer.domElement); controls.enablePan = false;

  // 현재 캐릭터 포즈를 담도록 카메라·그리드를 맞춘다(새 모션 로드 때마다 다시 호출).
  function frameCamera() {
    character.updateMatrixWorld(true);
    const box = new THREE.Box3().setFromObject(character);
    const c = box.getCenter(new THREE.Vector3());
    const h = Math.max(box.max.y - box.min.y, 0.1);
    grid.position.set(c.x, box.min.y, c.z);
    camera.position.set(c.x, c.y + h * 0.12, c.z + h * 2.3);
    camera.near = h / 100; camera.far = h * 200; camera.updateProjectionMatrix();
    controls.target.copy(c); controls.update();
  }
  frameCamera();

  const mixer = new THREE.AnimationMixer(character);

  function render() {
    controls.update();
    renderer.render(scene, camera);
  }

  function setMotion(bvhUrl) {
    return new Promise((resolve, reject) => {
      bvhLoader.load(bvhUrl, (res) => {
        mixer.stopAllAction();
        const clip = buildRetargetClip(res.clip, rig.kmByBone, rig.hipCfg);
        mixer.clipAction(clip).play();
        mixer.update(0);   // t=0 포즈로 세팅
        frameCamera();     // 새 모션 시작 포즈에 카메라 맞춤(수평 이동 없으니 이후 재프레이밍 불필요)
        resolve();
      }, undefined, reject);
    });
  }
  return { mixer, render, setMotion, renderer };
}

const panelEls = document.querySelectorAll('#panels .panel');
const contentSel = document.getElementById('content');
const styleSel = document.getElementById('style');
const runBtn = document.getElementById('run');
const statusEl = document.getElementById('status');
let panels = null;
let srcSkeleton = null; // rig 재계산용 (캐릭터 모델 교체 시 재사용)
let lastResult = null; // { url, tag } — 캐릭터 교체 후 결과 패널 복원용
let currentModelLabel = 'X_Bot'; // 저장 파일명에 어떤 캐릭터였는지 남기는 용도
const mixers = [];
const renderFns = [];
let panelRenderers = [];

// 캐릭터 모델을 바꿀 때마다 이전 렌더러를 정리하고 같은 rig 계산으로 3패널을 다시 세운다.
function buildPanels(template) {
  normalizeMixamoBoneNames(template);
  template.updateMatrixWorld(true);
  const rig = computeRig(pickSkinned(template), srcSkeleton); // 본 이름이 안 맞으면 여기서 던짐 — 기존 패널을 건드리기 전에 검증

  panelRenderers.forEach((r) => r.dispose());
  panelRenderers = [];
  mixers.length = 0;
  renderFns.length = 0;
  panelEls.forEach((p) => p.querySelectorAll('canvas').forEach((c) => c.remove()));

  panels = {
    content: makePanel(panelEls[0], template, rig),
    style: makePanel(panelEls[1], template, rig),
    result: makePanel(panelEls[2], template, rig),
  };
  mixers.push(panels.content.mixer, panels.style.mixer, panels.result.mixer);
  renderFns.push(panels.content.render, panels.style.render, panels.result.render);
  panelRenderers.push(panels.content.renderer, panels.style.renderer, panels.result.renderer);
}

function setStatus(msg, isErr) { statusEl.textContent = msg; statusEl.className = 'status' + (isErr ? ' err' : ''); }
function stem(name) { return name.replace(/\.bvh$/, ''); }

Promise.all([
  new Promise((res) => new FBXLoader().load('viewer_data/xbot.fbx', res)),
  fetch('/api/sources').then((r) => r.json()),
]).then(([xbot, { sources, uploads = [] }]) => {
  xbot.updateMatrixWorld(true);
  if (!sources.length) { setStatus('입력 BVH가 없습니다 (external/motion_puzzle/datasets/cmu/test_bvh 확인)', true); return; }
  // 데모용 큐레이션 — CMU 공식 설명(una-dinosauria/cmu-mocap 인덱스)에서 명확·상이한 동작만
  // 골라 한국어 라벨. 나머지 270개는 "전체(CMU ID)" 그룹에 그대로 둔다.
  const CURATED = [
    { f: '07_11.bvh', ko: '걷기', en: 'walk' },
    { f: '16_45.bvh', ko: '뛰기', en: 'run/jog' },
    { f: '118_05.bvh', ko: '점프', en: 'jump' },
    { f: '74_03.bvh', ko: '발차기', en: 'kick' },
    { f: '80_10.bvh', ko: '복싱', en: 'boxing' },
    { f: '90_28.bvh', ko: '브레이크댄스', en: 'breakdance' },
    { f: '60_03.bvh', ko: '살사 댄스', en: 'salsa dance' },
    { f: '13_01.bvh', ko: '앉았다 일어서기', en: 'sit & stand up' },
    { f: '55_07.bvh', ko: '닭 흉내', en: 'chicken' },
    { f: '137_11.bvh', ko: '공룡 흉내', en: 'dinosaur' },
    { f: '142_21.bvh', ko: '빗속에서 노래', en: 'singing in the rain' },
    { f: '127_21.bvh', ko: '달리다 점프', en: 'run-jump-stop' },
  ];
  const urlByName = {};
  for (const s of sources) urlByName[s.name] = s.url;

  // 업로드 목록은 재구성 가능하게 배열로 유지(업로드 시 추가 후 드롭다운 다시 채움)
  const uploaded = uploads.slice(); // [{name,url}]

  function fillSelect(sel) {
    const keep = sel.value;
    sel.textContent = '';
    if (uploaded.length) {
      const gu = document.createElement('optgroup'); gu.label = '내 업로드';
      for (const u of uploaded) gu.appendChild(new Option(stem(u.name), u.url));
      sel.appendChild(gu);
    }
    const g1 = document.createElement('optgroup'); g1.label = '추천 동작 (이름)';
    for (const c of CURATED) if (urlByName[c.f]) g1.appendChild(new Option(`${c.ko} — ${c.en}`, urlByName[c.f]));
    sel.appendChild(g1);
    const g2 = document.createElement('optgroup'); g2.label = '전체 (CMU ID)';
    for (const s of sources) g2.appendChild(new Option(stem(s.name), s.url));
    sel.appendChild(g2);
    if (keep) sel.value = keep;
  }
  fillSelect(contentSel); fillSelect(styleSel);
  // 기본 데모 페어: "걷기"에 "닭 흉내" 스타일 — 결 차이가 가장 눈에 띄는 조합
  contentSel.value = urlByName['07_11.bvh'] || contentSel.options[0].value;
  styleSel.value = urlByName['55_07.bvh'] || styleSel.options[0].value;

  // rig는 아무 소스 BVH의 rest로 한 번만 계산(전부 같은 CMU 골격). 캐릭터 모델 교체 시 재사용.
  bvhLoader.load(sources[0].url, (res0) => {
    srcSkeleton = res0.skeleton;
    buildPanels(xbot);
    (function animate() {
      requestAnimationFrame(animate);
      const d = masterClock.getDelta();
      mixers.forEach((m) => m.update(d));
      renderFns.forEach((f) => f());
    })();

    loadContent(); loadStyle();
    setStatus('준비됨 — 콘텐츠·스타일을 고르고 실행하세요.');

    // BVH 업로드: 촬영→GVHMR→retarget_smpl_to_cmu.py로 만든 CMU-BVH를 콘텐츠로 바로 투입.
    document.getElementById('upload').onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      setStatus(`업로드 중… ${file.name}`);
      try {
        const r = await fetch('/api/upload?name=' + encodeURIComponent(file.name), { method: 'POST', body: file });
        const j = await r.json();
        if (!r.ok) throw new Error(j.error || '업로드 실패');
        if (!uploaded.some((u) => u.name === j.name)) uploaded.push({ name: j.name, url: j.url });
        fillSelect(contentSel); fillSelect(styleSel);   // '내 업로드' 그룹 갱신
        contentSel.value = j.url; loadContent();          // 업로드본을 콘텐츠로 설정(스타일로도 선택 가능)
        setStatus(`업로드 완료 — "${stem(j.name)}"를 콘텐츠로 설정. 스타일로도 쓸 수 있어요.`);
      } catch (err) {
        setStatus('업로드 오류: ' + err.message, true);
      } finally {
        e.target.value = '';  // 같은 파일 다시 업로드 가능하게
      }
    };

    // 캐릭터 모델 교체: 새 FBX를 파싱해 3패널을 다시 세우고 현재 모션·결과를 복원한다.
    document.getElementById('modelUpload').onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      setStatus(`캐릭터 모델 불러오는 중… ${file.name}`);
      try {
        const buf = await file.arrayBuffer();
        const obj = new FBXLoader(embeddedOnly).parse(buf, '');
        if (!pickSkinned(obj)) throw new Error('스킨 메시(SkinnedMesh)가 없는 파일입니다');
        buildPanels(obj);
        currentModelLabel = file.name.replace(/\.fbx$/i, '');
        loadContent(); loadStyle();
        if (lastResult) { await panels.result.setMotion(lastResult.url); document.getElementById('result-tag').textContent = lastResult.tag; }
        setStatus(`"${file.name}" 캐릭터 적용됨`);
      } catch (err) {
        setStatus('오류: ' + err.message, true);
      } finally {
        e.target.value = '';
      }
    };
  });
});

// 콘텐츠/스타일 패널은 선택 즉시 그 모션을 보여준다 (태그는 드롭다운에 표시된 이름 그대로).
// 캐릭터 모델 교체 후에도 재사용하도록 모듈 스코프에 둔다.
function loadContent() { if (!panels) return; panels.content.setMotion(contentSel.value); document.getElementById('content-tag').textContent = contentSel.selectedOptions[0].text; }
function loadStyle() { if (!panels) return; panels.style.setMotion(styleSel.value); document.getElementById('style-tag').textContent = styleSel.selectedOptions[0].text; }
contentSel.onchange = loadContent;
styleSel.onchange = loadStyle;

runBtn.onclick = async () => {
  if (!panels) return;
  const content = contentSel.value.split('/').pop();
  const style = styleSel.value.split('/').pop();
  const contentLabel = contentSel.selectedOptions[0].text;
  const styleLabel = styleSel.selectedOptions[0].text;
  runBtn.disabled = true;
  setStatus(`Motion Puzzle 실행 중… (${contentLabel} ← ${styleLabel} 스타일, 최대 수십 초)`);
  try {
    const r = await fetch('/api/transfer', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content, style }),
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || '실행 실패');
    await panels.result.setMotion(j.url);
    lastResult = { url: j.url, tag: `${contentLabel} + ${styleLabel} 스타일` };
    document.getElementById('result-tag').textContent = lastResult.tag;
    setStatus('완료 — 오른쪽 결과 패널을 확인하세요.');
  } catch (e) {
    setStatus('오류: ' + e.message, true);
  } finally {
    runBtn.disabled = false;
  }
};

// 화면 저장(이미지/영상): 현재 패널들의 canvas를 라벨과 함께 오프스크린 캔버스에 합성해 내려받는다.
function getPanelLabel(panelEl) {
  const h2 = panelEl.querySelector('h2');
  const title = h2.childNodes[0].textContent.trim();
  const tag = h2.querySelector('.tag')?.textContent.trim() || '';
  return tag ? `${title} — ${tag}` : title;
}

function buildComposite() {
  const els = Array.from(panelEls);
  const canvases = els.map((p) => p.querySelector('canvas'));
  if (!canvases.some(Boolean)) return null;
  const gap = 16, labelH = 28;
  const w = canvases.reduce((s, c) => s + (c ? c.width : 0), 0) + gap * (canvases.length - 1);
  const h = Math.max(...canvases.filter(Boolean).map((c) => c.height)) + labelH;
  const cvs = document.createElement('canvas');
  cvs.width = w; cvs.height = h;
  const ctx = cvs.getContext('2d');
  function draw() {
    ctx.fillStyle = '#0b0e14';
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#d4deee';
    ctx.font = '600 16px -apple-system, sans-serif';
    ctx.textBaseline = 'top';
    let x = 0;
    els.forEach((p, i) => {
      const c = canvases[i];
      if (!c) return;
      ctx.fillText(getPanelLabel(p), x, 2);
      ctx.drawImage(c, x, labelH);
      x += c.width + gap;
    });
  }
  return { canvas: cvs, draw };
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

// 파일명에 못 쓰는 문자만 제거 — 한글은 그대로 두고 공백만 밑줄로.
function slugFilename(s) {
  return s.replace(/[\\/:*?"<>|]/g, '').trim().replace(/\s+/g, '_');
}

function saveFilename(ext) {
  const content = stem(contentSel.value.split('/').pop());
  const style = stem(styleSel.value.split('/').pop());
  return `style_transfer_${slugFilename(currentModelLabel)}_${slugFilename(content)}_${slugFilename(style)}_${Date.now()}.${ext}`;
}

document.getElementById('saveImgBtn').onclick = () => {
  const comp = buildComposite();
  if (!comp) return;
  comp.draw();
  comp.canvas.toBlob((blob) => { if (blob) downloadBlob(blob, saveFilename('png')); }, 'image/png');
};

let recorder = null, recordRAF = null;
document.getElementById('saveVidBtn').onclick = (e) => {
  const btn = e.currentTarget;
  if (recorder && recorder.state === 'recording') { recorder.stop(); return; }
  const comp = buildComposite();
  if (!comp) return;
  const stream = comp.canvas.captureStream(30);
  const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm';
  recorder = new MediaRecorder(stream, { mimeType });
  const chunks = [];
  recorder.ondataavailable = (ev) => { if (ev.data.size) chunks.push(ev.data); };
  recorder.onstop = () => {
    cancelAnimationFrame(recordRAF);
    downloadBlob(new Blob(chunks, { type: mimeType }), saveFilename('webm'));
    btn.textContent = '🔴 영상 시작';
    btn.classList.remove('recording');
  };
  (function loop() { comp.draw(); recordRAF = requestAnimationFrame(loop); })();
  recorder.start();
  btn.textContent = '⏹ 저장 중지';
  btn.classList.add('recording');
};
</script>
